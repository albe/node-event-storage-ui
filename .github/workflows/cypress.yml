name: Cypress

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Cypress binary
        run: npx cypress install

      - name: Build app
        run: npm run build

      - name: Start UI server
        run: |
          npm start > ui-server.log 2>&1 &
          for attempt in $(seq 1 120); do
            if curl --silent --fail --output /dev/null http://localhost:3000; then
              exit 0
            fi
            sleep 1
          done
          cat ui-server.log
          exit 1

      - name: Run Cypress functional tests
        run: npm run cypress:functional

      - name: Upload Cypress failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-failure-screenshots
          path: public/screenshots/generated/
          if-no-files-found: ignore

      - name: Show UI server log
        if: failure()
        run: cat ui-server.log
